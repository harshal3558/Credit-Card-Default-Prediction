name: CI/CD — Credit Card Default Prediction

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint + Test
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Python Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

    - name: Set MLflow env flags (suppress noise)
      run: |
        echo "MLFLOW_DISABLE_AGENT_HINT=1" >> $GITHUB_ENV
        echo "MLFLOW_TRACKING_URI=" >> $GITHUB_ENV

    - name: Train model (generate artifacts for tests)
      run: python main.py

    - name: Run pytest suite
      run: |
        python -m pytest tests/test_app.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker image (only on main branch push)
  # ─────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/ccdp-flask-ml-app:latest
          ${{ secrets.DOCKER_USERNAME }}/ccdp-flask-ml-app:${{ github.sha }}
